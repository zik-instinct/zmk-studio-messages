syntax = "proto3";

package zmk.gactyl;

// Gactyl Studio extension: stats recorder, live HRM timings, device auth, remote DFU.
// Schema version 1. Additive only; never renumber fields.

enum Side {
  ZMK_GACTYL_SIDE_LEFT = 0;
  ZMK_GACTYL_SIDE_RIGHT = 1;
}

message Request {
  oneof request_type {
    bool get_capabilities = 1;
    SignChallengeRequest sign_challenge = 2;
    ResetToBootloaderRequest reset_to_bootloader = 3;
    bool get_timings = 4;
    SetTimingsRequest set_timings = 5;
    bool save_timings = 6;
    bool discard_timings = 7;
    bool reset_timings = 8;
    StatsRequest get_stats = 9;
    bool clear_stats = 10;
    bool save_stats = 11;
    GetDeviceProfileRequest get_device_profile = 12;
  }
}

message Response {
  oneof response_type {
    GetCapabilitiesResponse get_capabilities = 1;
    SignChallengeResponse sign_challenge = 2;
    bool reset_to_bootloader = 3;
    TimingsState get_timings = 4;
    TimingsState set_timings = 5;
    TimingsState save_timings = 6;
    TimingsState discard_timings = 7;
    TimingsState reset_timings = 8;
    StatsChunk get_stats = 9;
    bool clear_stats = 10;
    bool save_stats = 11;
    GetDeviceProfileResponse get_device_profile = 12;
  }
}

message GetCapabilitiesResponse {
  uint32 schema_version = 1;       // = 2
  uint32 features = 2;             // bit0 auth, bit1 remote_dfu, bit2 timings, bit3 recorder
  Side side = 3;                   // which half answered
  bool has_device_key = 4;         // auth usable; never the key itself
  uint32 stats_format_version = 5; // stats blob layout version, = 2
  // Binds advertised stats/position numbering to the connected board's physical
  // layout identity (NOT just name/keycount). Computed by firmware over the
  // ACTIVE zmk_physical_layout exactly as served by keymap.get_physical_layouts:
  //   input = display_name UTF-8 || 0x00 ||
  //           for each key in DT array order: width,height,x,y,r,rx,ry as
  //           int16 LE (0 for rotation fields when rotation not configured)
  //   fingerprint u64 = first 8 bytes (LE) of SHA-256(input), split because the
  //   firmware builds with PB_WITHOUT_64BIT (no 64-bit wire types).
  // Client computes the same value from the active layout of its
  // get_physical_layouts response; mismatch => do not bind key_counts/HRM
  // positions to that layout (positions still valid as raw indices).
  uint32 layout_fingerprint_lo = 6; // low 32 bits of the fingerprint (LE half)
  uint32 layout_fingerprint_hi = 7; // high 32 bits
}

// mac = HMAC-SHA256(psk32, ASCII "GACTYL_UPDATE_V1" || 0x00 || nonce32)
message SignChallengeRequest {
  bytes nonce = 1;     // exactly 32 bytes on the wire, else meta invalid_request
  string audience = 2; // exact "zmk.gtelem.com/update/v1", else meta invalid_request
}
message SignChallengeResponse {
  bytes mac = 1; // 32 bytes
}

message ResetToBootloaderRequest {
  Side target = 1; // LEFT: direct; RIGHT: split-BLE invoke, meta error if unlinked
}

message Timings {
  uint32 tapping_term_ms = 1;        // 50..500
  uint32 require_prior_idle_ms = 2;  // 0..500
  uint32 quick_tap_ms = 3;           // 0..500 (0 = disabled)
}

message TimingsState {
  Timings active = 1;     // volatile, applies to future presses
  Timings persisted = 2;  // last saved
  Timings defaults = 3;   // compiled-in
  uint32 revision = 4;    // bumps on every accepted mutation
}

message SetTimingsRequest {
  Timings timings = 1;
  uint32 expected_revision = 2; // mismatch -> meta invalid_request
}

message StatsRequest {
  uint32 offset = 1;      // byte offset into the frozen snapshot
  uint32 max_len = 2;     // 0 = firmware-chosen chunk
  uint32 snapshot_id = 3; // 0 = open new snapshot; else must match the open one
}

message StatsChunk {
  uint32 snapshot_id = 1;
  uint32 total_len = 2;
  uint32 offset = 3;
  bytes data = 4;
}

// ---- Device profile (schema v2, features bit4) ----
// SECURED. local is always filled by the answering half. peer is the central's
// cached read of the peripheral over the split link; valid only when
// peer_state == CACHED. Peripherals do not serve Studio RPC: on the right half
// the same data is exposed read-only over the split GATT characteristic
// (see gactyl_profile.c for the wire blob layout).

enum ProfileTarget {
  ZMK_GACTYL_PROFILE_TARGET_BOTH = 0;
  ZMK_GACTYL_PROFILE_TARGET_LEFT = 1;
  ZMK_GACTYL_PROFILE_TARGET_RIGHT = 2;
}

enum PeerState {
  ZMK_GACTYL_PEER_STATE_UNKNOWN = 0;       // not central, never attempted, or read failed
  ZMK_GACTYL_PEER_STATE_CACHED = 1;        // peer field is a valid cached read
  ZMK_GACTYL_PEER_STATE_DISCONNECTED = 2;  // no split link
  ZMK_GACTYL_PEER_STATE_PENDING = 3;       // connected, read in flight; client retries shortly
}

message GetDeviceProfileRequest {
  ProfileTarget target = 1; // BOTH (default) or RIGHT includes peer when cached; LEFT = local only
}

message DeviceProfile {
  Side side = 1;
  uint32 device_id_hi = 2; // FICR DEVICEID[1]
  uint32 device_id_lo = 3; // FICR DEVICEID[0]
  bool sd_present = 4;     // MBR SD magic 0x51B1E5DB present at 0x3004
  uint32 sd_magic = 5;     // raw u32 at 0x3004
  uint32 sd_fwid = 6;      // raw u32 at 0x300C (S140 6.1.1: 0xB6)
  uint32 sd_size = 7;      // raw u32 at 0x3008
  uint32 app_start = 8;    // sd_size when sd_present, else 0x1000 (MBR-only)
  // Informational only: clients MUST gate direct writes on sd_present &&
  // sd_magic==0x51B1E5DB && app_start matches the verified image start; never use this as an erase probe.
  string build_sha = 9;    // <= 40 hex chars; "" when not CI-generated
  string build_time = 10;  // <= 24 chars ISO-8601 UTC; "" when unknown (always "" for peer)
  uint32 build_run = 11;   // CI run NUMBER (not run id); 0 when unknown
}

message GetDeviceProfileResponse {
  DeviceProfile local = 1;
  DeviceProfile peer = 2;    // valid only when peer_state == ZMK_GACTYL_PEER_STATE_CACHED
  PeerState peer_state = 3;
  uint32 peer_age_ms = 4;    // cache age in ms; 0 when not CACHED
}
